# Coverage gate for libmicnote, read by gcovr from the repo root:
#   cmake --preset coverage && cmake --build --preset coverage
#   ctest --preset coverage && gcovr build/coverage
# Counts Micnote's own code only: not tests, proto/gen or fetched deps.
# Lines, functions and branches must all be 100%. Branches that exist only
# for exception unwinding, or that gcc proves unreachable, don't count.
# Code that truly can't run under test gets GCOVR_EXCL_START/STOP and a
# comment saying why.
root = .
filter = core/src/
filter = core/cli/
filter = core/include/
exclude-throw-branches = yes
exclude-unreachable-branches = yes
txt-metric = line
print-summary = yes
fail-under-line = 100
fail-under-function = 100
fail-under-branch = 100

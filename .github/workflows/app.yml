# Flutter app (stage 0b onward):
# - check: micnote_core (analyze, test, bindings regenerate without a diff)
#   and the app (format, analyze, widget tests). Tests run the build hook, so
#   they call the real libmicnote built for Linux.
# - build: the app for every platform. Each build runs micnote_core's
#   hook/build.dart, which builds core/ with CMake for that target. The Linux
#   bundle is then started under Xvfb to check it loads libmicnote.
# The hook needs cmake and ninja on PATH (on Windows, Visual Studio's developer
# prompt provides both). On Linux, Flutter hands the hook the clang on PATH;
# Ubuntu 24.04's clang 18 can't use libstdc++ 14's <expected>, so clang 20
# goes first on PATH (see tools/versions.env).
name: app

on:
  push:
    paths:
      - app/**
      - core/**
      - proto/**
      - tools/versions.env
      - .github/workflows/app.yml
  pull_request:
    paths:
      - app/**
      - core/**
      - proto/**
      - tools/versions.env
      - .github/workflows/app.yml
  schedule:
    - cron: "0 6 * * 1" # Mondays, with the other workflows
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      flutter: ${{ steps.v.outputs.flutter }}
      java: ${{ steps.v.outputs.java }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/versions.env
          sparse-checkout-cone-mode: false
      - id: v
        run: |
          get() { sed -n "s/^$1=\([^[:space:]#]*\).*/\1/p" tools/versions.env; }
          echo "flutter=$(get FLUTTER_VERSION)" >>"$GITHUB_OUTPUT"
          echo "java=$(get JAVA_VERSION)" >>"$GITHUB_OUTPUT"

  check:
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # libclang for ffigen; clang 20 and ninja for the build hook.
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq ninja-build clang-20 libclang-20-dev
          echo /usr/lib/llvm-20/bin >>"$GITHUB_PATH"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ needs.versions.outputs.flutter }}
          channel: stable
          cache: true
      - name: micnote_core
        working-directory: app/packages/micnote_core
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed lib test hook tool
          dart analyze --fatal-infos
          dart test
      - name: Bindings match core/include/micnote.h
        working-directory: app/packages/micnote_core
        run: |
          dart run tool/ffigen.dart
          git diff --exit-code lib/src/bindings.dart
      - name: App
        working-directory: app
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test

  build:
    name: build (${{ matrix.platform }})
    needs: versions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, os: ubuntu-24.04, build: linux --release }
          - { platform: android, os: ubuntu-24.04, build: apk --release }
          - { platform: windows, os: windows-latest, build: windows --release }
          - { platform: macos, os: macos-latest, build: macos --release }
          - { platform: ios, os: macos-latest, build: ios --release --no-codesign }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq ninja-build clang-20 libgtk-3-dev xvfb
          echo /usr/lib/llvm-20/bin >>"$GITHUB_PATH"
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: command -v ninja || brew install ninja
      - if: matrix.platform == 'android'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ needs.versions.outputs.java }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ needs.versions.outputs.flutter }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: flutter build ${{ matrix.build }}
      - name: Linux bundle loads libmicnote
        if: matrix.platform == 'linux'
        working-directory: app/build/linux/x64/release/bundle
        run: |
          test -f lib/libmicnote.so
          set +e
          xvfb-run -a timeout 20 ./micnote >run.log 2>&1
          code=$?
          set -e
          cat run.log
          # timeout's 124 means the app was still running: it started.
          [ "$code" = 124 ] || { echo "::error::app exited with $code"; exit 1; }
          if grep -q "Failed to load dynamic library" run.log; then
            echo "::error::the bundle couldn't load libmicnote"; exit 1
          fi

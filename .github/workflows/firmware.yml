# Firmware (stage 0b onward), all inside Nordic's NCS toolchain image pinned
# in tools/versions.env:
# - build: sysbuild (MCUboot + app) for both boards, plus the DK with
#   release.conf; uploads the signed app image and the DFU package.
# - twister: firmware/tests on native_sim, as a Linux process, then a check
#   that proto/testvectors matches what the generator suite printed, and a
#   build of the native_sim puck simulator (firmware/sim).
# - sim-e2e: micnote-cli syncs from that simulator (firmware/sim/e2e.py).
# - bsim: BLE end to end in BabbleSim (firmware/bsim/run.py): the puck's BLE
#   module against a simulated host and a stranger on one radio channel.
# - lint: clang-format on the firmware C (firmware/.clang-format).
# external/ is cached keyed on firmware/west.yml, whose name-allowlist keeps
# the checkout to the modules the builds use; shallow fetches keep it small.
name: firmware

on:
  push:
    paths:
      - firmware/**
      - proto/**
      - tools/versions.env
      - .github/workflows/firmware.yml
  pull_request:
    paths:
      - firmware/**
      - proto/**
      - tools/versions.env
      - .github/workflows/firmware.yml
  schedule:
    - cron: "0 6 * * 1" # Mondays, with core and devenv
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A job's container image can't be computed inside that job, so read the
  # pinned image from versions.env here and hand it on.
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/versions.env
          sparse-checkout-cone-mode: false
      - id: image
        run: |
          get() { sed -n "s/^$1=\([^[:space:]#]*\).*/\1/p" tools/versions.env; }
          echo "image=ghcr.io/nrfconnect/sdk-nrf-toolchain:$(get NCS_VERSION)@$(get NCS_TOOLCHAIN_IMAGE_DIGEST)" >>"$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: ${{ needs.toolchain.outputs.image }}
    defaults:
      run:
        # The image sets up the toolchain environment only in bash sessions.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: nrf5340dk, board: nrf5340dk/nrf5340/cpuapp, dir: fw-dk }
          - { name: thingy53, board: thingy53/nrf5340/cpuapp, dir: fw-thingy53 }
          - name: nrf5340dk release
            board: nrf5340dk/nrf5340/cpuapp
            dir: fw-dk-release
            cmake_args: -DEXTRA_CONF_FILE=release.conf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/west-workspace
      - name: Build
        run: west build -b "${{ matrix.board }}" firmware/app -d "build/${{ matrix.dir }}" -- ${{ matrix.cmake_args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.dir }}
          path: |
            build/${{ matrix.dir }}/app/zephyr/zephyr.signed.hex
            build/${{ matrix.dir }}/mcuboot/zephyr/zephyr.hex
            build/${{ matrix.dir }}/dfu_application.zip
          if-no-files-found: error

  twister:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ${{ needs.toolchain.outputs.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/west-workspace
      # native_sim builds a 32-bit Linux program with the host compiler, and its
      # runner with make; the toolchain image has neither. dpkg prints a "perl
      # binaries are mismatched" warning here (the image's own perl is on the
      # toolchain environment's paths); it's harmless and the install succeeds.
      - name: Host compiler (32-bit) and make
        run: apt-get update -q && apt-get install -yq --no-install-recommends gcc-multilib g++-multilib make
      - name: Tests
        run: west twister -T firmware/tests -p native_sim --inline-logs
      # The Opus and audio suites on a Cortex-M33 under QEMU as well: their
      # packet hashes have to match native_sim's, which shows the DSP inline
      # assembly is bit-exact, and the stacks are real (native_sim's aren't).
      - name: Audio on Cortex-M33 (QEMU)
        run: |
          apt-get install -yq --no-install-recommends qemu-system-arm
          west twister -T firmware/tests/opus -T firmware/tests/audio -p mps2/an521/cpu1 --inline-logs -O twister-out-arm
      # The puck simulator (firmware/sim) builds for native_sim too.
      - name: Build the puck simulator
        run: west build -b native_sim firmware/sim -d build/sim
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: puck-sim
          path: build/sim/sim/zephyr/zephyr.exe
          if-no-files-found: error
      # The generator suite above printed proto/testvectors; the committed
      # files must be exactly what it produced.
      - name: Test vectors up to date
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 proto/testvectors.py --check --log twister-out
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twister-out
          path: twister-out/

  # BLE in BabbleSim (firmware/bsim/README.md): build BabbleSim from the
  # components west fetched, build the test image for nrf52_bsim, and run the
  # puck, a host and a stranger. About 10 s of simulation once built.
  bsim:
    needs: toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ${{ needs.toolchain.outputs.image }}
    defaults:
      run:
        shell: bash
    env:
      BSIM_OUT_PATH: ${{ github.workspace }}/external/tools/bsim
      BSIM_COMPONENTS_PATH: ${{ github.workspace }}/external/tools/bsim/components
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/west-workspace
      # Same as twister's: the simulated boards are 32-bit Linux programs.
      - name: Host compiler (32-bit) and make
        run: apt-get update -q && apt-get install -yq --no-install-recommends gcc-multilib g++-multilib make
      - name: Build BabbleSim
        run: make -C "$BSIM_OUT_PATH" everything -j"$(nproc)"
      - name: BLE end to end
        run: python3 firmware/bsim/run.py --keep bsim-logs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bsim-logs
          path: bsim-logs/

  # micnote-cli against the simulator twister built (firmware/sim/e2e.py):
  # status, sync without ack, restart on the same flash, sync with ack, list.
  # The CLI needs gcc 14, which the NCS image lacks, so this runs on the plain
  # runner; the simulator is a 32-bit program, hence libc6-i386.
  sim-e2e:
    needs: twister
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -q && sudo apt-get install -yq ninja-build libc6-i386
      - name: Build micnote-cli
        run: |
          cmake --preset dev
          cmake --build --preset dev --target micnote-cli
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: puck-sim
          path: build/sim
      - name: End to end
        run: |
          chmod +x build/sim/zephyr.exe
          python3 firmware/sim/e2e.py --sim build/sim/zephyr.exe --cli build/dev/core/bin/Debug/micnote-cli

  # firmware/.clang-format (Zephyr style on top of the repo's). Same
  # clang-format as core's lint job; fix locally with the command in that file.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -q && sudo apt-get install -yq clang-format-20
      - name: clang-format
        run: git ls-files 'firmware/*.c' 'firmware/*.h' | xargs clang-format-20 --dry-run --Werror

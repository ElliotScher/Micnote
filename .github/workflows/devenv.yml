# Checks the dev-environment scripts (stage 0a):
# - lint: shellcheck and PSScriptAnalyzer.
# - doctor-*: doctor runs correctly on every platform and shell contributors
#   use. Runners lack most of the toolchain, so doctor itself reports
#   failures; these jobs check it ran to completion and reported what's there.
# - bootstrap-*: from a bare image, `bootstrap --no-firmware` installs
#   everything and its closing doctor run passes; a second run installs nothing.
# - firmware-weekly: the full install including the NCS toolchain (several GB),
#   weekly and on demand only.
name: devenv

on:
  push:
    paths:
      - scripts/**
      - tools/versions.env
      - .github/workflows/devenv.yml
      - .github/scripts/check-doctor.sh
  pull_request:
    paths:
      - scripts/**
      - tools/versions.env
      - .github/workflows/devenv.yml
      - .github/scripts/check-doctor.sh
  schedule:
    - cron: "0 6 * * 1" # Mondays: catches distro package and upstream URL drift
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh .github/scripts/*.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $findings = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Warning,Error
          $findings | Format-Table -AutoSize RuleName, ScriptName, Line, Message -Wrap
          if ($findings) { exit 1 }

  # `expect`: ';'-separated regexes, each of which must match a line of output.
  doctor-sh:
    name: doctor.sh (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Hosted runners have cmake and a compiler, so those rows must pass.
          - name: ubuntu-24.04
            os: ubuntu-24.04
            shell: bash
            cxx: g++-14
            expect: "^cmake .* OK;^C\\+\\+23 probe .*builds, runs +OK"
          - name: macos, bash 3.2
            os: macos-latest
            shell: /bin/bash # the system bash 3.2, not Homebrew's
            expect: "^cmake .* OK;^C\\+\\+23 probe "
          # Bare distro containers: nothing installed, so rows must say MISSING.
          - name: fedora
            os: ubuntu-24.04
            container: fedora:latest
            shell: bash
            expect: "^cmake .* MISSING;^C\\+\\+ compiler .* MISSING"
          - name: arch
            os: ubuntu-24.04
            container: archlinux:latest
            shell: bash
            expect: "^cmake .* MISSING;^C\\+\\+ compiler .* MISSING"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run doctor
        env:
          CXX: ${{ matrix.cxx }}
          EXPECT: ${{ matrix.expect }}
        run: |
          # An empty CXX would skip doctor's compiler search, so drop it.
          [ -n "$CXX" ] || unset CXX
          IFS=';' read -ra expects <<<"$EXPECT"
          bash .github/scripts/check-doctor.sh "${{ matrix.shell }}" "${expects[@]}"

  doctor-ps1:
    name: doctor.ps1 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows, PowerShell 5.1
            os: windows-latest
            shell: powershell
            expect: "^cmake .* OK;^MSVC \\(cl\\) .* OK;^C\\+\\+23 probe \\(MSVC\\) .* OK"
          - name: windows, PowerShell 7
            os: windows-latest
            shell: pwsh
            expect: "^cmake .* OK;^MSVC \\(cl\\) .* OK;^C\\+\\+23 probe \\(MSVC\\) .* OK"
          - name: ubuntu, PowerShell 7
            os: ubuntu-24.04
            shell: pwsh
            # Ubuntu's clang 18 can't use libstdc++ 13's std::expected (doctor
            # rightly reports OLD), so use g++-14 as the bash job does.
            cxx: g++-14
            expect: "^cmake .* OK;^C\\+\\+23 probe .*builds, runs +OK"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run doctor
        shell: pwsh
        env:
          DOCTOR_SHELL: ${{ matrix.shell }}
          EXPECT: ${{ matrix.expect }}
          CXX: ${{ matrix.cxx }}
        run: |
          if (-not $env:CXX) { Remove-Item Env:CXX -ErrorAction SilentlyContinue }
          $out = Join-Path ([IO.Path]::GetTempPath()) 'doctor.txt'
          function Invoke-Doctor([string[]]$Extra) {
            & $env:DOCTOR_SHELL -NoProfile -ExecutionPolicy Bypass -File scripts/doctor.ps1 @Extra *> $out
            $LASTEXITCODE
          }
          function Fail([string]$Msg) { Write-Output "::error::$Msg"; exit 1 }

          $code = Invoke-Doctor @()
          $text = @(Get-Content $out)
          $text
          Write-Output "--- doctor exited $code under $env:DOCTOR_SHELL"

          if ($code -notin 0, 1) { Fail "doctor exited $code (expected 0 or 1)" }
          if (-not ($text -match '^Tool\s+Required\s+Found\s+Status')) { Fail 'no table header' }
          if (-not ($text -match 'All required tools found\.|required tools are missing or too old')) {
            Fail 'no closing verdict: doctor stopped early'
          }
          $errs = $text -match 'doctor\.ps1:\d+|Exception|CategoryInfo|is not recognized as'
          if ($errs) { $errs; Fail 'PowerShell errors in doctor output' }
          foreach ($re in $env:EXPECT.Split(';')) {
            if (-not ($text -match $re)) { Fail "expected a line matching: $re" }
          }

          $null = Invoke-Doctor @('-Quiet')
          if (@(Get-Content $out) -match '  OK ') { Fail '-Quiet printed OK rows' }
          Write-Output 'doctor check passed'
          # GitHub's pwsh wrapper otherwise exits with $LASTEXITCODE, which is
          # doctor's expected 1 from the run above.
          exit 0

  bootstrap-sh:
    name: bootstrap.sh (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu 24.04, os: ubuntu-24.04, container: "ubuntu:24.04" }
          - { name: debian 13, os: ubuntu-24.04, container: "debian:13" }
          - { name: fedora, os: ubuntu-24.04, container: "fedora:latest" }
          - { name: arch, os: ubuntu-24.04, container: "archlinux:latest" }
          - { name: macos, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap (exits non-zero unless its doctor run passes)
        run: bash scripts/bootstrap.sh --yes --no-firmware
      - name: Second run installs nothing
        run: |
          set +e
          out="$(bash scripts/bootstrap.sh --yes --no-firmware 2>&1)"; code=$?
          printf '%s\n' "$out"
          [ "$code" = 0 ] || { echo "::error::second run exited $code"; exit 1; }
          printf '%s\n' "$out" | grep -q 'Nothing to install' ||
            { echo "::error::second run planned work: not idempotent"; exit 1; }

  bootstrap-ps1:
    name: bootstrap.ps1 (windows, PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap (exits non-zero unless its doctor run passes)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\bootstrap.ps1 -Yes -NoFirmware
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::bootstrap exited $LASTEXITCODE"; exit 1 }
      - name: Second run installs nothing
        shell: powershell
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File scripts\bootstrap.ps1 -Yes -NoFirmware 2>&1
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0) { Write-Output "::error::second run exited $code"; exit 1 }
          if (-not ($out -match 'Nothing to install')) { Write-Output '::error::second run planned work: not idempotent'; exit 1 }
          exit 0

  firmware-weekly:
    name: bootstrap.sh with firmware (ubuntu)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Full bootstrap, NCS toolchain included
        run: bash scripts/bootstrap.sh --yes
      - name: NCS toolchain is usable
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          nrfutil toolchain-manager launch --ncs-version "$(grep -oP '^NCS_VERSION=\K\S+' tools/versions.env)" -- west --version

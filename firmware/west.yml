manifest:
  self:
    path: firmware

  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect
    - name: xiph
      url-base: https://github.com/xiph

  projects:
    - name: sdk-nrf
      remote: ncs
      revision: v3.4.1
      path: nrf
      import:
        path-prefix: external
        name-allowlist:
          - zephyr
          - mcuboot
          - nanopb
          - littlefs
          - cmsis_6
          - hal_nordic
          - nrfxlib
          - segger
          - mbedtls
          - oberon-psa-crypto
          - tf-psa-crypto
          - zcbor
          - trusted-firmware-m

    # libopus, built by our own Zephyr wrapper (firmware/modules/opus), not by
    # its CMakeLists. Pinned to the release commit; the tag is v1.6.1.
    - name: opus
      remote: xiph
      revision: 22244de5a79bd1d6d623c32e72bf1954b56235be
      path: external/modules/lib/opus

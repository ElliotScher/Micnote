# libmicnote (stage 0b onward):
# - build-test: configure -> build -> ctest on Linux (gcc 14, clang 20),
#   macOS (Apple clang) and Windows (MSVC, static CRT), warnings as errors.
# - sanitizers: the asan preset's tests, then a short libFuzzer smoke run.
#   Weekly and on demand only, alongside devenv's firmware-weekly job. No
#   timeout-minutes, so the 6 h default applies: the runner's apt mirror is
#   sometimes slow enough to take most of an hour to fetch clang-20.
# - coverage: gcc --coverage + gcovr; 100% line, function and branch coverage
#   of Micnote's own code (gcovr.cfg) or the job fails.
# - lint: clang-format and clang-tidy.
# - asr: the optional speech recognition (-DMICNOTE_ASR=ON, whisper.cpp),
#   built at -O2 and run against ggml-tiny.en (pinned below, cached).
# libsecret-1-dev: micnote-cli's OS keychain (core/cli/os_keychain.cpp).
# Ubuntu 24.04's default clang 18 can't use libstdc++ 14's <expected>, so the
# clang jobs use clang 20 from noble-updates (see tools/versions.env).
name: core

on:
  push:
    paths:
      - core/**
      - proto/**
      - models/manifest.json
      - CMakeLists.txt
      - CMakePresets.json
      - .clang-format
      - .clang-tidy
      - gcovr.cfg
      - tools/versions.env
      - .github/workflows/core.yml
  pull_request:
    paths:
      - core/**
      - proto/**
      - models/manifest.json
      - CMakeLists.txt
      - CMakePresets.json
      - .clang-format
      - .clang-tidy
      - gcovr.cfg
      - tools/versions.env
      - .github/workflows/core.yml
  schedule:
    - cron: "0 6 * * 1" # Mondays, same as devenv's firmware-weekly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux gcc-14, os: ubuntu-24.04, preset: dev, cc: gcc-14, cxx: g++-14 }
          - { name: linux clang-20, os: ubuntu-24.04, preset: dev, cc: clang-20, cxx: clang++-20, apt: clang-20 }
          - { name: macos apple-clang, os: macos-latest, preset: dev }
          - { name: windows msvc, os: windows-latest, preset: windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq ninja-build libsecret-1-dev ${{ matrix.apt }}
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: command -v ninja || brew install ninja
      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        # pwsh, not bash: Git Bash's /usr/bin/link would shadow MSVC's link.exe.
        shell: pwsh
        run: |
          # An empty CC/CXX would override CMake's compiler search, so drop it.
          if (-not $env:CC) { Remove-Item Env:CC -ErrorAction SilentlyContinue }
          if (-not $env:CXX) { Remove-Item Env:CXX -ErrorAction SilentlyContinue }
          cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        env:
          # The runner's own keychain (os_keychain_test.cpp); Linux has none.
          MICNOTE_TEST_OS_KEYCHAIN: ${{ runner.os != 'Linux' && '1' || '' }}
        run: ctest --preset ${{ matrix.preset }}
      - name: micnote-cli --version
        shell: bash
        run: |
          cli="$(find build/${{ matrix.preset }}/core/bin -name 'micnote-cli*' -type f | head -n1)"
          "$cli" --version

  sanitizers:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      CC: clang-20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -q && sudo apt-get install -yq ninja-build libsecret-1-dev clang-20 libclang-rt-20-dev
      - name: ASan + UBSan tests
        run: |
          cmake --preset asan
          cmake --build --preset asan
          ctest --preset asan
      - name: libFuzzer smoke run
        run: |
          cmake --preset fuzz
          cmake --build --preset fuzz
          # -max_total_time is checked between inputs, so `timeout` is the hard
          # stop if one input never returns; -timeout makes libFuzzer itself
          # report any input slower than 10 s as a bug.
          for f in build/fuzz/core/bin/fuzz_*; do
            echo "::group::$f"
            timeout --kill-after=10 120 "$f" -max_total_time=30 -timeout=10 -print_final_stats=1
            echo "::endgroup::"
          done

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -q && sudo apt-get install -yq ninja-build libsecret-1-dev
      - name: Build and test with coverage
        run: |
          cmake --preset coverage
          cmake --build --preset coverage
          ctest --preset coverage
      - name: Coverage gate (100%, see gcovr.cfg)
        run: |
          gcovr_version="$(sed -n 's/^GCOVR_VERSION=\([^[:space:]#]*\).*/\1/p' tools/versions.env)"
          pipx run "gcovr==$gcovr_version" --gcov-executable gcov-14 build/coverage

  # micnote_asr (core/src/asr/, stage 2 PR 4): only its own test executable
  # and the CLI, at RelWithDebInfo. The model is the smallest English one,
  # enough to check whisper.cpp's JFK sample transcribes, pinned to a
  # revision of the Hugging Face repo and checked by SHA-256.
  #
  # One job per GPU backend (MICNOTE_ASR_GPU). Runners have no GPU Vulkan can
  # use, so that one checks the build, and that it falls back to the CPU.
  asr:
    name: asr ${{ matrix.gpu }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gpu: "off", os: ubuntu-24.04, cc: gcc-14, cxx: g++-14 }
          - { gpu: vulkan, os: ubuntu-24.04, cc: gcc-14, cxx: g++-14, apt: libvulkan-dev glslc spirv-headers }
          - { gpu: metal, os: macos-latest, cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      MODEL_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-tiny.en.bin
      MODEL_SHA256: 921e4cf8686fdd993dcd081a5da5b6c365bfde1162e72b08d75ac75289920b1f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq ninja-build libsecret-1-dev ${{ matrix.apt }}
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: command -v ninja || brew install ninja
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-models
          key: whisper-model-${{ env.MODEL_SHA256 }}
      - name: Model
        run: |
          mkdir -p ci-models
          [ -f ci-models/ggml-tiny.en.bin ] || curl -fsSL -o ci-models/ggml-tiny.en.bin "$MODEL_URL"
          echo "$MODEL_SHA256  ci-models/ggml-tiny.en.bin" | shasum -a 256 -c
      - name: Build
        run: |
          cmake --preset asr -DMICNOTE_ASR_GPU=${{ matrix.gpu }} -DMICNOTE_LLM=ON
          cmake --build --preset asr --target micnote_asr_tests micnote_llm_tests micnote-cli micnote-wer micnote-eval
      - name: Transcribe
        env:
          MICNOTE_TEST_MODEL: ${{ github.workspace }}/ci-models/ggml-tiny.en.bin
        # The language model's tests skip without a model (gigabytes): CI only
        # checks that it builds and loads.
        run: |
          build/asr/core/bin/micnote_asr_tests
          build/asr/core/bin/micnote_llm_tests

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang-20
      CXX: clang++-20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -q && sudo apt-get install -yq ninja-build libsecret-1-dev clang-20 clang-tidy-20 clang-format-20
      - name: clang-format
        run: git ls-files 'core/*.c' 'core/*.cpp' 'core/*.h' 'core/*.hpp' | xargs clang-format-20 --dry-run --Werror
      # Apple's libc++ instantiates its floating-point formatter with every
      # std::format call, and that needs to_chars, which the app's iOS 16 /
      # macOS 13 targets lack. The CLI (desktop only) may use it; the library
      # the app links may not.
      - name: No std::format in libmicnote
        run: '! git grep -n -e "std::format" -e "<format>" -- core/src core/include'
      # The single-config lint preset: dev's Multi-Config database lists every
      # file once per configuration, and clang-tidy then checks each three
      # times (it outgrew the job's timeout that way).
      - name: clang-tidy
        run: |
          cmake --preset lint
          run-clang-tidy-20 -quiet -p build/lint 'core/(src|cli|tests)/'
